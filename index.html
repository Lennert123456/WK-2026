<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WK 2026 Live</title>
    <style>
        :root { --ios-bg: #000000; --ios-card: #1C1C1E; --ios-blue: #0A7AFF; --ios-text: #FFFFFF; }
        body { background-color: var(--ios-bg); color: var(--ios-text); font-family: -apple-system, system-ui, sans-serif; margin: 0; padding-bottom: 80px; }
        .status-bar { height: 44px; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; position: sticky; top: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 100; }
        .container { padding: 16px; }
        .ios-card { background: var(--ios-card); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .section-title { font-size: 22px; font-weight: 700; margin: 20px 0 12px 0; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .nav-bar { position: fixed; bottom: 0; width: 100%; height: 65px; background: rgba(28,28,30,0.95); backdrop-filter: blur(20px); border-top: 0.5px solid rgba(255,255,255,0.1); display: flex; justify-content: space-around; padding-top: 10px; }
        .tab-button { background: none; border: none; color: #8E8E93; font-size: 10px; display: flex; flex-direction: column; align-items: center; }
        .tab-button.active { color: var(--ios-blue); }
        .tab-button span { font-size: 24px; margin-bottom: 4px; }
        .venue-card { background: var(--ios-card); border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div class="status-bar"><span id="status-time">00:00</span><span>5G 🔋</span></div>
    <div class="container">
        <div id="home-tab" class="tab-content active">
            <h1 style="font-size: 34px; margin-bottom: 5px;">WK 2026</h1>
            <div class="ios-card" style="text-align: center; background: linear-gradient(135deg, #0A7AFF, #5856D6);">
                <div style="font-size: 12px; text-transform: uppercase;">Aftellen tot de aftrap</div>
                <div style="display: flex; justify-content: center; gap: 15px; margin-top: 10px;">
                    <div><div id="days" style="font-size: 28px; font-weight: 800;">0</div><small>DAGEN</small></div>
                    <div><div id="hours" style="font-size: 28px; font-weight: 800;">0</div><small>UREN</small></div>
                </div>
            </div>
        </div>
        <div id="matches-tab" class="tab-content"></div>
        <div id="standings-tab" class="tab-content"></div>
        <div id="venues-tab" class="tab-content"></div>
    </div>
    <nav class="nav-bar">
        <button class="tab-button active" onclick="showTab('home')"><span>🏠</span>Home</button>
        <button class="tab-button" onclick="showTab('matches')"><span>⚽</span>Live</button>
        <button class="tab-button" onclick="showTab('standings')"><span>📊</span>Standen</button>
        <button class="tab-button" onclick="showTab('venues')"><span>🏟️</span>Stadions</button>
    </nav>

    <script>
        const venues = [
            { city: 'Mexico-Stad', stadium: 'Estadio Azteca', flag: '🇲🇽', cap: '87.523' },
            { city: 'New York/NJ', stadium: 'MetLife Stadium', flag: '🇺🇸', cap: '82.500' }
        ];

        function showTab(t) {
            document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(x => x.classList.remove('active'));
            document.getElementById(t + '-tab').classList.add('active');
            event.currentTarget.classList.add('active');
            if(t === 'matches') renderMatches();
            if(t === 'standings') renderStandings();
            if(t === 'venues') renderVenues();
        }

        function renderMatches() {
            const c = document.getElementById('matches-tab');
            c.innerHTML = '<h2 class="section-title">⚽ Live Scores</h2><div class="ios-card">🇳🇱 Nederland 2 - 1 Brazilië 🇧🇷 <br><small style="color:#34C759; animation:pulse 1.5s infinite">LIVE 82\'</small></div>';
        }

        function renderStandings() {
            const c = document.getElementById('standings-tab');
            c.innerHTML = '<h2 class="section-title">📊 Groep A</h2><div class="ios-card">1. 🇳🇱 Nederland - 3pt<br>2. 🇺🇸 USA - 1pt</div>';
        }

        function renderVenues() {
            const c = document.getElementById('venues-tab');
            c.innerHTML = '<h2 class="section-title">🏟️ Stadions</h2>';
            venues.forEach(v => { c.innerHTML += `<div class="venue-card"><span>${v.flag} ${v.city}</span><small>${v.cap}</small></div>`; });
        }

        function updateTime() {
            const n = new Date();
            document.getElementById('status-time').textContent = n.getHours() + ":" + String(n.getMinutes()).padStart(2, '0');
            const d = new Date('2026-06-11') - n;
            document.getElementById('days').textContent = Math.floor(d / 86400000);
            document.getElementById('hours').textContent = Math.floor((d / 3600000) % 24);
        }

        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
