<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FIFA World Cup 2026</title>
    <style>
        :root { --ios-bg: #000000; --ios-card: #1C1C1E; --ios-blue: #0A7AFF; --ios-gray: #8E8E93; --ios-green: #34C759; }
        body { background-color: var(--ios-bg); color: white; font-family: -apple-system, system-ui, sans-serif; margin: 0; padding-bottom: 100px; -webkit-tap-highlight-color: transparent; }
        
        /* Kleurrijke Header zoals screenshot */
        .header { background: linear-gradient(135deg, #4158D0 0%, #C850C0 46%, #FFCC70 100%); padding: 40px 20px; text-align: center; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; }
        .header h1 { font-size: 32px; font-weight: 900; margin: 0; letter-spacing: -1px; }
        .header p { font-size: 16px; opacity: 0.9; margin-top: 5px; }

        .container { padding: 15px; }
        .ios-card { background: var(--ios-card); border-radius: 18px; padding: 15px; margin-bottom: 15px; border: 0.5px solid rgba(255,255,255,0.1); }
        
        /* Tab Systeem */
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }

        /* Groepen Navigatie */
        .group-nav { display: flex; overflow-x: auto; gap: 8px; padding: 10px 0; scrollbar-width: none; }
        .group-pill { background: #2C2C2E; padding: 8px 16px; border-radius: 20px; font-size: 14px; white-space: nowrap; }
        .group-pill.active { background: var(--ios-blue); }

        /* Stadions Lijst */
        .stadium-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 0.5px solid rgba(255,255,255,0.1); }
        .stadium-city { font-weight: bold; font-size: 16px; }
        .stadium-info { font-size: 12px; opacity: 0.6; }

        /* Bottom Nav */
        .nav-bar { position: fixed; bottom: 0; width: 100%; height: 85px; background: rgba(28,28,30,0.9); backdrop-filter: blur(20px); display: flex; justify-content: space-around; padding-top: 10px; border-top: 0.5px solid rgba(255,255,255,0.1); }
        .tab-btn { background: none; border: none; color: var(--ios-gray); font-size: 10px; display: flex; flex-direction: column; align-items: center; width: 25%; }
        .tab-btn.active { color: var(--ios-blue); }
        .tab-btn span { font-size: 24px; margin-bottom: 4px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body onload="initApp()">

    <div class="header">
        <div style="font-size: 30px; margin-bottom: 10px;">🇺🇸 🏆 🇨🇦 🏆 🇲🇽</div>
        <h1>FIFA World Cup 2026</h1>
        <p id="countdown">Laden...</p>
    </div>

    <div id="schema-tab" class="tab-content active container">
        <h2 style="font-size: 28px;">Speelschema</h2>
        <div class="ios-card">
            <b style="color:var(--ios-blue)">DONDERDAG 11 JUNI</b>
            <div style="display:flex; justify-content:space-between; margin-top:8px;"><span>🇲🇽 Mexico - TBD</span><span>21:00</span></div>
            <small style="opacity:0.5">Estadio Azteca, Mexico-Stad</small>
        </div>
        <div class="ios-card" style="border-left: 4px solid var(--ios-green);">
            <b style="color:var(--ios-green)">ZONDAG 14 JUNI</b>
            <div style="display:flex; justify-content:space-between; margin-top:8px;"><span>🇳🇱 Nederland - Japan</span><span>20:00</span></div>
            <small style="opacity:0.5">AT&T Stadium, Dallas</small>
        </div>
        <div class="ios-card">
            <b style="color:var(--ios-blue)">MAANDAG 15 JUNI</b>
            <div style="display:flex; justify-content:space-between; margin-top:8px;"><span>🇧🇪 België - TBD</span><span>21:00</span></div>
            <small style="opacity:0.5">Lumen Field, Seattle</small>
        </div>
    </div>

    <div id="standen-tab" class="tab-content container">
        <h2 style="font-size: 28px;">Groepsfase</h2>
        <div class="group-nav" id="group-nav"></div>
        <div class="ios-card">
            <h3 id="group-title" style="margin-top:0;">Groep A</h3>
            <table style="width:100%; border-collapse: collapse;" id="group-table"></table>
        </div>
    </div>

    <div id="stadions-tab" class="tab-content container">
        <h2 style="font-size: 28px;">Stadions</h2>
        <div class="ios-card" id="stadiums-list"></div>
    </div>

    <nav class="nav-bar">
        <button class="tab-btn active" onclick="showTab('schema', this)"><span>🗓️</span>Schema</button>
        <button class="tab-btn" onclick="showTab('standen', this)"><span>📊</span>Standen</button>
        <button class="tab-btn" onclick="showTab('stadions', this)"><span>🏟️</span>Stadions</button>
    </nav>

    <script>
        const appData = {
            stadions: [
                { city: "Mexico-Stad", name: "Estadio Azteca", cap: "87.523" },
                { city: "New York/NJ", name: "MetLife Stadium", cap: "82.500" },
                { city: "Dallas", name: "AT&T Stadium", cap: "80.000" },
                { city: "Los Angeles", name: "SoFi Stadium", cap: "70.240" },
                { city: "Toronto", name: "BMO Field", cap: "45.000" },
                { city: "Miami", name: "Hard Rock Stadium", cap: "64.767" }
            ],
            groepen: {
                A: ["🇲🇽 Mexico", "🇿🇦 Zuid-Afrika", "🇰🇷 Zuid-Korea", "🇨🇿 Tsjechië"],
                B: ["🇨🇦 Canada", "🇲🇦 Marokko", "🇨🇴 Colombia", "🇫🇯 Fiji"],
                C: ["🇺🇸 USA", "🇵🇾 Paraguay", "🇩🇰 Denemarken", "🇹🇳 Tunesië"],
                D: ["🇳🇱 Nederland", "🇯🇵 Japan", "🇩🇿 Algerije", "🇪🇨 Ecuador"]
            }
        };

        function initApp() {
            renderStadions();
            renderGroupNav();
            updateCountdown();
        }

        function showTab(id, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(id + '-tab').classList.add('active');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function renderStadions() {
            document.getElementById('stadiums-list').innerHTML = appData.stadions.map(s => `
                <div class="stadium-item">
                    <div><div class="stadium-city">${s.city}</div><div class="stadium-info">${s.name}</div></div>
                    <div style="color:var(--ios-blue); font-weight:bold;">${s.cap}</div>
                </div>
            `).join('');
        }

        function renderGroupNav() {
            const nav = document.getElementById('group-nav');
            nav.innerHTML = Object.keys(appData.groepen).map((g, i) => 
                `<div class="group-pill ${i===0?'active':''}" onclick="loadGroup('${g}', this)">Gr. ${g}</div>`
            ).join('');
            loadGroup('A', nav.firstChild);
        }

        function loadGroup(g, pill) {
            document.querySelectorAll('.group-pill').forEach(p => p.classList.remove('active'));
            pill.classList.add('active');
            document.getElementById('group-title').innerText = `Groep ${g}`;
            document.getElementById('group-table').innerHTML = appData.groepen[g].map((t, i) => `
                <tr style="border-bottom:0.5px solid rgba(255,255,255,0.05)">
                    <td style="padding:12px 0;">${i+1}. ${t}</td>
                    <td style="text-align:right; opacity:0.6;">0 pt</td>
                </tr>
            `).join('');
        }

        function updateCountdown() {
            const d = Math.floor((new Date('2026-06-11T21:00:00') - new Date()) / 86400000);
            document.getElementById('countdown').innerText = `Nog ${d} dagen tot de aftrap!`;
        }
    </script>
</body>
</html>
